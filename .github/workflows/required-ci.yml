name: AssistWithMoving CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Classify CI scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-change.mjs --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --event "${{ github.event_name }}" --github-output "$GITHUB_OUTPUT"

      - name: Validate state-only publication
        if: steps.scope.outputs.state_only == 'true'
        run: node scripts/verify-tracker.mjs && node scripts/project-philosophy-docs.mjs --check

      - name: Record lightweight state path
        if: steps.scope.outputs.state_only == 'true'
        run: echo "Validated the exact state-only range without dependency installation, application build, tests, credentials, seeding, or browser execution." >> "$GITHUB_STEP_SUMMARY"

      - name: Use Node.js
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.20.0
          cache: npm

      - name: Install from the lockfile
        if: steps.scope.outputs.run_full == 'true'
        run: npm ci

      - name: Verify state-publication safeguards
        if: steps.scope.outputs.run_full == 'true'
        run: npm run verify:state-publication

      - name: Lint
        if: steps.scope.outputs.run_full == 'true'
        run: npm run lint

      # Must stay immediately before Typecheck. The checked-in Convex bindings
      # are what give `api.*`/`internal.*` their types; if they are stale the
      # typecheck passes against `any` and the errors only surface later, in
      # the Vercel build's own deploy step. Proving them fresh first is what
      # makes the next step a real fresh-bindings typecheck. This step is
      # offline: it regenerates from the modules on disk, with no credentials.
      - name: Verify the checked-in Convex bindings are fresh
        if: steps.scope.outputs.run_full == 'true'
        run: npm run check:convex-bindings-fresh

      - name: Typecheck
        if: steps.scope.outputs.run_full == 'true'
        run: npm run typecheck

      - name: Verify REST and MCP contract drift
        if: steps.scope.outputs.run_full == 'true'
        run: npm run contract:drift

      - name: Verify anonymous OAuth and API-key refusal boundaries
        if: steps.scope.outputs.run_full == 'true'
        run: >-
          npx vitest run
          tests/unit/mcp-oauth-config-lock.test.ts
          tests/unit/mcp-route-auth.test.ts

      - name: Build without credentials or deployment keys
        if: steps.scope.outputs.run_full == 'true'
        run: npm run build

  full-tests:
    name: Unit tests (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Classify CI scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-change.mjs --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --event "${{ github.event_name }}" --github-output "$GITHUB_OUTPUT"

      - name: Validate state-only publication
        if: steps.scope.outputs.state_only == 'true'
        run: node scripts/verify-tracker.mjs && node scripts/project-philosophy-docs.mjs --check

      - name: Record lightweight state path
        if: steps.scope.outputs.state_only == 'true'
        run: echo "Validated the exact state-only range without dependency installation or the unit suite." >> "$GITHUB_STEP_SUMMARY"

      - name: Use Node.js
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.20.0
          cache: npm

      - name: Install from the lockfile
        if: steps.scope.outputs.run_full == 'true'
        run: npm ci

      - name: Run the full suite without making it a required policy check
        if: steps.scope.outputs.run_full == 'true'
        run: npm run test
